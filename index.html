<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog preview card</title>
 
</head>
<body>
    <div id="main">

      <article id="card">

        <img src="assets/images/illustration-article.svg" alt="image of the course HTML & CSS">
        
      
      <header>
        <span id="tag">Learning</span>
        <time id="date" datetime="2023-12-21">Published 21 Dec 2023</time>
         
        <h1>HTML & CSS Foundations  </h1>
        
        <p>
          These languages are the backbone of every website defining structure, content and presentation.
        </p> 
      </header>
        <footer>
          <img id="avatar" src="assets/images/image-avatar.webp" alt="image of the instructor">
          <span id="author-name">Greg Hooper</span>
        </footer>        

      </article>

    </div>
</body>
</html>
